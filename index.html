<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be Mine? 💖</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff5f9e,#9b5cff,#4facfe);
      padding:20px;
    }

    .container{
      width:100%;
      max-width:700px;
      padding:40px 25px;
      border-radius:30px;
      text-align:center;
      background:rgba(255,255,255,0.2);
      backdrop-filter:blur(10px);
      color:white;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      position:relative;
    }

    .emoji{
      font-size:70px;
      margin-bottom:10px;
    }

    h1{
      font-size:clamp(2rem, 6vw, 4rem);
      margin-bottom:15px;
    }

    #message{
      font-size:clamp(1rem, 3vw, 1.5rem);
      margin-bottom:35px;
      line-height:1.5;
      padding:0 10px;
    }

    .buttons{
      position:relative;
      height:180px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      flex-wrap:wrap;
    }

    button{
      padding:14px 30px;
      border:none;
      border-radius:40px;
      font-size:clamp(1rem, 3vw, 1.5rem);
      cursor:pointer;
      transition:0.3s;
      min-width:120px;
    }

    #yesBtn{
      background:white;
      color:#ff4d8d;
      font-weight:bold;
    }

    #yesBtn:hover{
      transform:scale(1.08);
    }

    #noBtn{
      background:#555;
      color:white;
      position:absolute;
    }

    .celebration{
      text-align:center;
      color:white;
      padding:20px;
      animation:float 3s infinite ease-in-out;
    }

    .celebration .big-heart{
      font-size:100px;
    }

    .celebration h1{
      font-size:clamp(2.5rem, 8vw, 5rem);
      margin:15px 0;
    }

    .celebration p{
      font-size:clamp(1rem, 4vw, 1.8rem);
      line-height:1.7;
      max-width:700px;
      margin:auto;
    }

    .celebration h2{
      margin-top:30px;
      font-size:clamp(1.5rem, 5vw, 3rem);
    }

    @keyframes float{
      0%{transform:translateY(0);}
      50%{transform:translateY(-10px);}
      100%{transform:translateY(0);}
    }

    .heart{
      position:absolute;
      font-size:30px;
      animation:fall linear forwards;
      pointer-events:none;
    }

    @keyframes fall{
      from{
        transform:translateY(-10vh) rotate(0deg);
        opacity:1;
      }

      to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
      }
    }

    /* Mobile */

    @media(max-width:600px){

      .container{
        padding:30px 20px;
      }

      .emoji{
        font-size:60px;
      }

      .buttons{
        height:220px;
      }

      button{
        width:140px;
      }

      #noBtn{
        position:absolute;
      }

    }

  </style>
</head>

<body>

  <div class="container" id="mainBox">

    <div class="emoji">💌</div>

    <h1>Will You Be Mine?</h1>

    <p id="message">
      I promise this is the cutest decision ever 🌸
    </p>

    <div class="buttons">

      <button id="yesBtn">
        Yes 💖
      </button>

      <button id="noBtn">
        No 😅
      </button>

    </div>

  </div>

  <script>

    const lines = [
      "Nope 😝 Try again!",
      "Are you really sure? 💕",
      "Come on... it’ll be cute 🥺",
      "The universe already shipped us ✨",
      "Even the stars said yes 🌙",
      "You can’t escape love 💖",
      "That button doesn’t believe in no 😎",
      "Just click yes already 🌸",
      "My heart says yes for you 💘",
      "One tiny yes = infinite happiness 🌈"
    ];

    const noBtn = document.getElementById("noBtn");
    const msg = document.getElementById("message");
    const yesBtn = document.getElementById("yesBtn");

    function moveButton(){

      const maxX = window.innerWidth - 140;
      const maxY = window.innerHeight - 100;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";

      const randomText =
        lines[Math.floor(Math.random() * lines.length)];

      msg.innerText = randomText;
    }

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("click", moveButton);

    yesBtn.addEventListener("click", () => {

      document.body.innerHTML = `
      
      <div class="celebration">

        <div class="big-heart">💖</div>

        <h1>YAYYYYY ✨</h1>

        <p>
          You just made this tiny colorful universe
          the happiest place ever 🌸
          <br><br>
          Every playlist sounds sweeter now 💕
        </p>

        <h2>
          You + Me = Forever 🌈
        </h2>

      </div>
      
      `;

      setInterval(() => {

        const heart = document.createElement("div");

        heart.classList.add("heart");

        const emojis = ["💖","💕","💘","🌸","✨"];

        heart.innerText =
          emojis[Math.floor(Math.random()*emojis.length)];

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.animationDuration =
          (2 + Math.random()*3) + "s";

        document.body.appendChild(heart);

        setTimeout(()=>{
          heart.remove();
        },5000);

      },250);

    });

  </script>

</body>
</html>
